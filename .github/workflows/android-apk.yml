name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build protocol
        run: npm run build --workspace=@agent-remote/protocol

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk agent-remote-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-remote-android-apk
          path: agent-remote-android.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: agent-remote-android.apk
          generate_release_notes: true
